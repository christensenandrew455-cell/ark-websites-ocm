name: Refresh iOS app icon

on:
  push:
    branches:
      - fix/ios-production-release
    paths:
      - scripts/generate-ios-icon.mjs
      - .github/workflows/refresh-ios-icon.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-production-release
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate exact iOS icon
        run: node scripts/generate-ios-icon.mjs
      - name: Commit generated icon
        run: |
          if git diff --quiet -- ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png; then
            echo "Icon is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          git commit -m "Update iOS app icon"
          git push origin HEAD:fix/ios-production-release
